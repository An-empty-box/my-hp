<!DOCTYPE html>
<html lang="jp">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>なにもない箱</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>なにもない箱</h1>
            <p>初学者です。とりあえずGitからHPを公開する練習してます</p>
            <p>このなにもない箱にちょっとずつモノを入れてゆこうと思っています</p>
        </header>

        <main>
            <section class="card">
                <h2>いまのわたし</h2>
                <p>プログラミングの学習のアウトプットのためにこのページを書いています</p>
            </section>

            <section class="card">
                <h2>Works (ミニゲーム)</h2>
                <div class="game-box">
                    <h3>🎯数あてゲーム(1~100)</h3>
                    <p>コンピューターが選んだ数字を当ててください！</p>
                    
                    <!-- 数字の入力欄。JavaScriptから中身を取り出すために id="guessInput"という名札をつけている -->
                    <input type="number" id="guessInput" min="1" max="100" placeholder="1~100">
                    
                    <!-- クリックされた瞬間(onclick)に、Javascriptの checkGuess() 関数を呼び出す -->
                    <button onclick="checkGuess()">判定する</button>
                    
                    <!-- クリックされた瞬間に resetGame() 関数を呼び出す -->
                    <button onclick="resetGame()" class="sub-btn">リセット</button>
                    
                    <!-- ゲーム結果のメッセージを表示する場所。id="resultMessage"でJavaScriptから文字を置き換える -->
                    <p id="resultMessage" class="message">数字を入力して「判定する」を押してね</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 なにもない箱</p>
        </footer>

        <script src="game.js"></script>
    </body>
</html>
